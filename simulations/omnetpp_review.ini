[General]
# Historical single-channel LoRaWAN model for legacy scenarios.
**.lorawanMultichannel = false
**.startJoined = false
network = opp_lora_relay_official.simulations.Chapter7Network
repeat = 30
seed-set = ${repetition}
simtime-resolution = 1ms
sim-time-limit = 30d
warmup-period = 4d
debug-on-errors = false
record-eventlog = false
print-undisposed = false
result-dir = .
output-scalar-file = ${resultdir}/${configname}-${repetition}.sca
output-vector-file = ${resultdir}/${configname}-${repetition}.vec
**.scalar-recording = true
**.vector-recording = false

# Common, controlled baseline for chapter 1 of the reviewer responses.
# The central population is uniform by area in a disk; the weak populations
# are uniform in two rectangles. Both are parameterised in Chapter7Network.ned.
**.numEndnodes = 50
**.extranodex1 = 3
**.extranodex2 = 2
**.numGateways = 1
**.numRelays = 2
**.numIpBridges = 0
**.centralX = 750
**.centralY = 450
**.centralMinRadius = 0
**.R = 350
**.weak1x = 108
**.weak1y = 250
**.weak1Width = 300
**.weak1Height = 300
**.weak2x = 50
**.weak2y = 550
**.weak2Width = 300
**.weak2Height = 300
**.gw1x = 750
**.gw1y = 450
**.gw2x = 150
**.gw2y = 250
**.gw3x = 250
**.gw3y = 750
**.relay1x = 300
**.relay1y = 250
**.relay2x = 300
**.relay2y = 650

# PHY and reception model. RSSI thresholding and the independent Gaussian
# path-loss term are intentionally kept identical in every comparison.
**.sensitivityAllRadios = -114.0
**.pathlosStd = 4.41
**.relayAccessLinkMarginDb = 0
**.relayBackhaulLosGainDb = 10
**.ipBridgeLinkMarginDb = 50
**.enableKeeperDistortion = 0
**.clockDriftMax = 40
**.forceSF = 12
**.ADRtarget = 6
**.ADRtolerance = 3

# Application traffic: two daily windows and two reports in each window.
**.windowsPerDay = 2
**.transmittingWindowStart1 = 0
**.transmittingWindowStart2 = 720
**.transmittingWindowDuration1 = 720
**.transmittingWindowDuration2 = 720
**.framesPerWindowMin = 2
**.framesPerWindowMax = 2
**.applicationPayloadLength = 51
**.missedPacketsToSearchRelay = 6
**.ackEvery = 5
**.ts011MissedAcksToRelay = 1
**.ts011JoinRelayEvery = 4
**.receiveDelay1 = 1s
**.joinAcceptDelay1 = 5s
**.receiveWindowDuration = 1s
**.epRxrDelay = 7s

# Class A receive windows.
**.listeningWindowStart1 = 0
**.listeningWindowStart2 = 720
**.listeningWindowDuration1 = 0
**.listeningWindowDuration2 = 0
**.listeningWindowRX1 = 1.0
**.listeningWindowRX2 = 1.0
**.listeningWindowRXR = 1.0
**.listeningWindowRXC = 1.0
**.listeningWindowRXCR = 3.0

# TS011-1.0.1 Class A subset implemented by the simulator.
# Frequency IDs: ordinary LoRaWAN=1, default WOR=10, second WOR=11.
# Data after WOR and the relay backhaul still contend with ordinary uplinks.
**.ts011DefaultWorChannel = 10
**.ts011SecondWorChannel = 11
**.ts011SecondChannelEnabled = false
**.ts011UplinkChannel = 1
**.ts011RelayUplinkChannel = 1
**.ts011Rx2Channel = 1
**.ts011RxrChannel = 1
**.ts011CadPeriodicity = 1s
**.ts011ChannelScanSymbols = 8
**.ts011CadToRxSymbols = 8
**.ts011EndDeviceSpreadingFactor = 9
**.ts011RelaySpreadingFactor = 9
**.ts011RelayClockAccuracyPpm = 40
**.ts011EndDeviceClockAccuracyPpm = 40
**.ts011WorAckDelay = 50ms
**.ts011WorDataDelay = 50ms
**.ts011WorValidityProbability = 1
**.ts011WorAckWindow = 1s
**.ts011UplinkListenTimeout = 8s
**.ts011RelayForwardDelay = 50ms
**.ts011RxrDelay = 18s
**.ts011WorAckProbability = 1
**.ts011MaximumForwardedPayload = 222
**.ts011ForwardingEnabled = true
**.ts011JoinFilterRules = "forward:0:"
**.ts011JoinReloadRate = 4
**.ts011JoinBucketSize = 8
**.ts011PerDeviceReloadRate = -1
**.ts011PerDeviceBucketSize = 0
**.ts011TrustedReloadRate = 8
**.ts011TrustedBucketSize = 16
**.ts011GlobalReloadRate = 8
**.ts011GlobalBucketSize = 16

# EP4312388 relay-access parameters.
**.EP431EndnodeRelaySF = 9

# Currents used in the thesis reconstruction. Relay rules must precede the
# generic assignments because OMNeT++ uses the first matching pattern.
**.relay[*].radio.currentConsumptionWOR = 0.070
# E006: the historical constant above applies only with dynamic energy disabled.
**.ts011DynamicWorEnergy = true
**.ts011CadSymbolNum = 4
**.currentConsumptionCad = 3.84
**.relay[*].radio.currentConsumptionIdle = 0.0056
**.relay[*].radio.currentConsumptionBaseOffset = 0.003
**.currentConsumptionRx = 4.6
**.currentConsumptionTx = 25.5
**.currentConsumptionWOR = 0.89
**.currentConsumptionIdle = 0.0253
**.currentConsumptionBaseOffset = 0
**.sendInterval = exponential(20s)

[Config Review_EP_Base]
description = "EP4312388, controlled chapter-1 baseline"
**.retransmissionModel = 2

[Config Review_TS011_Base]
description = "TS011-1.0.1, controlled chapter-1 baseline"
**.retransmissionModel = 1

[Config Review_TS011_DualChannel]
extends = Review_TS011_Base
description = "TS011 with the optional secondary WOR channel"
**.ts011SecondChannelEnabled = true

[Config Review_2GW_Missing]
description = "Missing table 7.1 point: 2 GW, SF12, N=2, two 12 h windows"
**.retransmissionModel = 2
**.numRelays = 0
**.numGateways = 2

[Config Review_EP_Burst]
extends = Review_EP_Base
description = "Synchronous alarm burst spread uniformly over one minute"
warmup-period = 1d
**.windowsPerDay = 1
**.transmittingWindowStart1 = 720
**.transmittingWindowDuration1 = 1
**.framesPerWindowMin = 1
**.framesPerWindowMax = 1

[Config Review_EP_Dynamic]
extends = Review_EP_Base
description = "EP4312388 with the simulator's time-varying attenuation state"
**.enableKeeperDistortion = 1
