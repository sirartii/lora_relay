[General]
network = opp_lora_relay_official.simulations.Chapter7Network
repeat = 30
seed-set = ${repetition}
simtime-resolution = 1ms
sim-time-limit = 30 d
debug-on-errors = false
record-eventlog = false
print-undisposed = false
result-dir = .
output-scalar-file = ${resultdir}/${configname}-${repetition}.sca
**.scalar-recording = true
**.vector-recording = false

# Baseline from section 7.1: 50 ED around G1 and weak islands of 3 + 2 ED.
**.numEndnodes = 50
**.numGateways = 1
**.numRelays = 0
**.numIpBridges = 0
**.enableKeeperDistortion = 0
**.sensitivityAllRadios = -114.0
**.missedPacketsToSearchRelay = 3
**.retransmissionModel = 2
**.clockDriftMax = 40
**.pathlosStd = 4.41
**.forceSF = 12
**.ADRtarget = 6
**.ADRtolerance = 3

# Relay parameters.
**.TS011CADPeriodicity = 1.0
**.TS011ChannelScanLength = 8.0
**.TS011NoOfChannels = 1
**.TS011EndNodeSF = 9
**.EP431EndnodeRelaySF = 9

# Two daily transmission windows. Their durations are overridden per scenario.
**.listeningWindowStart1 = 0
**.listeningWindowStart2 = 720
**.listeningWindowDuration1 = 0
**.listeningWindowDuration2 = 0
**.transmittingWindowStart1 = 0
**.transmittingWindowStart2 = 720
**.transmittingWindowDuration1 = 720
**.transmittingWindowDuration2 = 720
**.windowsPerDay = 2
**.framesPerWindowMin = 1
**.framesPerWindowMax = 1
**.listeningWindowRX1 = 1.0
**.listeningWindowRX2 = 1.0
**.listeningWindowRXR = 1.0
**.listeningWindowRXC = 1.0
**.listeningWindowRXCR = 3.0

# Values used by the current repository implementation. Section 7.1 of the
# thesis says 4.9 mA for RX; use --rx-current-ma 4.9 in the master script to
# rerun with that documented value.
**.currentConsumptionRx = 4.6
**.currentConsumptionTx = 25.5
**.currentConsumptionWOR = 0.89
**.currentConsumptionIdle = 0.0253
**.sendInterval = exponential(20s)

[Config Chapter7_T01]
description = "Table 7.1 test 1: 1 GW, SF12, N=1, windows 3h"
**.transmittingWindowDuration1 = 180
**.transmittingWindowDuration2 = 180

[Config Chapter7_T02]
description = "Table 7.1 test 2: 1 GW, SF12, N=1, windows 12h"

[Config Chapter7_T03]
description = "Table 7.1 test 3: 1 GW, SF12, N=3, windows 12h"
**.framesPerWindowMin = 3
**.framesPerWindowMax = 3

[Config Chapter7_T04]
description = "Table 7.1 test 4: 1 GW, SF12, N=4, windows 12h"
**.framesPerWindowMin = 4
**.framesPerWindowMax = 4

[Config Chapter7_T05]
description = "Table 7.1 test 5: 1 GW, ADR, N=4, windows 12h"
**.forceSF = -1
**.framesPerWindowMin = 4
**.framesPerWindowMax = 4

[Config Chapter7_T06]
description = "Table 7.1 test 6: 1 GW, ADR, N=6, windows 12h"
**.forceSF = -1
**.framesPerWindowMin = 6
**.framesPerWindowMax = 6

[Config Chapter7_T07]
description = "Table 7.1 test 7: 2 GW, SF12, N=1, windows 12h"
**.numGateways = 2

[Config Chapter7_T08]
description = "Table 7.1 test 8: 3 GW, SF12, N=1, windows 12h"
**.numGateways = 3

[Config Chapter7_T09]
description = "Table 7.1 test 9: 3 GW, ADR, N=2, windows 12h"
**.numGateways = 3
**.forceSF = -1
**.framesPerWindowMin = 2
**.framesPerWindowMax = 2

[Config Chapter7_T10]
description = "Table 7.1 test 10: 1 GW + 2 TS011 relays, SF12, N=2"
**.numRelays = 2
**.retransmissionModel = 1
**.framesPerWindowMin = 2
**.framesPerWindowMax = 2

[Config Chapter7_T11]
description = "Table 7.1 test 11: 1 GW + 2 EP431 relays, SF12, N=2"
**.numRelays = 2
**.retransmissionModel = 2
**.framesPerWindowMin = 2
**.framesPerWindowMax = 2

[Config Chapter7_T12]
description = "Table 7.1 test 12: 1 GW + 2 LoRa-to-IP bridges, SF12, N=2"
**.numIpBridges = 2
**.retransmissionModel = 2
**.framesPerWindowMin = 2
**.framesPerWindowMax = 2

[Config Chapter7_T13]
description = "Additional scenario: 2 GW, SF12, N=2, windows 12h"
**.numGateways = 2
**.framesPerWindowMin = 2
**.framesPerWindowMax = 2

[Config Chapter7_Sweep]
description = "Base used by figures 7.2, 7.3, 7.5, 7.12 and 7.13"
