[General]
network = opp_lora_relay_official.simulations.Chapter7Network
repeat = 30
seed-set = ${repetition}
simtime-resolution = 1ms
sim-time-limit = 30 d
warmup-period = 4 d
debug-on-errors = false
record-eventlog = false
print-undisposed = false
result-dir = .
output-scalar-file = ${resultdir}/${configname}-${repetition}.sca
**.scalar-recording = true
**.vector-recording = false

# Baseline from section 7.1: 50 ED around G1 and weak islands of 3 + 2 ED.
**.numEndnodes = 50
**.numGateways = 1
**.numRelays = 0
**.numIpBridges = 0
**.enableKeeperDistortion = 0
**.sensitivityAllRadios = -114.0
**.missedPacketsToSearchRelay = 6
**.retransmissionModel = 2
**.clockDriftMax = 40
**.pathlosStd = 4.41
**.relayLinkMarginDb = 10
**.ipBridgeLinkMarginDb = 50
**.forceSF = 12
**.ADRtarget = 6
**.ADRtolerance = 3

# Relay parameters.
**.TS011CADPeriodicity = 1.0
**.TS011ChannelScanLength = 8.0
**.TS011NoOfChannels = 1
**.TS011EndNodeSF = 9
**.EP431EndnodeRelaySF = 9

# Two daily transmission windows. Their durations are overridden per scenario.
**.listeningWindowStart1 = 0
**.listeningWindowStart2 = 720
**.listeningWindowDuration1 = 0
**.listeningWindowDuration2 = 0
**.transmittingWindowStart1 = 0
**.transmittingWindowStart2 = 720
**.transmittingWindowDuration1 = 720
**.transmittingWindowDuration2 = 720
**.windowsPerDay = 2
**.framesPerWindowMin = 1
**.framesPerWindowMax = 1
**.listeningWindowRX1 = 1.0
**.listeningWindowRX2 = 1.0
**.listeningWindowRXR = 1.0
**.listeningWindowRXC = 1.0
**.listeningWindowRXCR = 3.0

# Correct RX current derived earlier in the thesis. The 4.9 mA value repeated
# in chapter 7 is an erratum.
**.currentConsumptionRx = 4.6
**.currentConsumptionTx = 25.5
# The historical chapter 7 setup used an average 70 uA WOR budget.  The
# later 0.89 mA value must not be charged continuously while TS011 is idle.
**.relay[*].radio.currentConsumptionWOR = 0.070
**.currentConsumptionWOR = 0.89
# Chapter 4 distinguishes the relay base load from an end device with sensors.
# OMNeT++ uses the first matching parameter assignment, so the specific rule
# must precede the common end-device value.
**.relay[*].radio.currentConsumptionIdle = 0.0056
**.ipbridge[*].radio.currentConsumptionIdle = 0.0056
# Empirical RL calibration agreed for the reconstructed chapter 7 model.
**.relay[*].radio.currentConsumptionBaseOffset = 0.003
**.ipbridge[*].radio.currentConsumptionBaseOffset = 0.003
**.currentConsumptionIdle = 0.0253
# Chapter 2.4.5 defines separate per-event terms for LTE attach and uplink, but
# does not publish their numerical modem parameters. Only their sum is
# identifiable from table 7.1. The initial split below keeps both terms visible;
# the combined 1656 mA*s transaction charge is calibrated against 135.12 uA
# using the mean event count from 30 deterministic repetitions.
**.ipbridge[*].radio.lteAttachEnergyMAs = 1440
**.ipbridge[*].radio.lteTransmitEnergyMAs = 216
**.sendInterval = exponential(20s)

[Config Chapter7_T01]
description = "Table 7.1 test 1: 1 GW, SF12, N=1, windows 3h"
**.transmittingWindowDuration1 = 180
**.transmittingWindowDuration2 = 180

[Config Chapter7_T02]
description = "Table 7.1 test 2: 1 GW, SF12, N=1, windows 12h"

[Config Chapter7_T03]
description = "Table 7.1 test 3: 1 GW, SF12, N=3, windows 12h"
**.framesPerWindowMin = 3
**.framesPerWindowMax = 3

[Config Chapter7_T04]
description = "Table 7.1 test 4: 1 GW, SF12, N=4, windows 12h"
**.framesPerWindowMin = 4
**.framesPerWindowMax = 4

[Config Chapter7_T05]
description = "Table 7.1 test 5: 1 GW, ADR, N=4, windows 12h"
**.forceSF = -1
**.framesPerWindowMin = 4
**.framesPerWindowMax = 4

[Config Chapter7_T06]
description = "Table 7.1 test 6: 1 GW, ADR, N=6, windows 12h"
**.forceSF = -1
**.framesPerWindowMin = 6
**.framesPerWindowMax = 6

[Config Chapter7_T07]
description = "Table 7.1 test 7: 2 GW, SF12, N=1, windows 12h"
**.numGateways = 2

[Config Chapter7_T08]
description = "Table 7.1 test 8: 3 GW, SF12, N=1, windows 12h"
**.numGateways = 3

[Config Chapter7_T09]
description = "Table 7.1 test 9: 3 GW, ADR, N=2, windows 12h"
**.numGateways = 3
**.forceSF = -1
**.framesPerWindowMin = 2
**.framesPerWindowMax = 2

[Config Chapter7_T10]
