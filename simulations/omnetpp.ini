[Config DualRelay]
description = "Symulacja z dwoma urządzeniami posredniczacymi"
extends = General
repeat = 1
network = LoraRelay3
**.numEndnodes = 50



[General]
network = LoraRelay
simtime-resolution = 1ms
#cpu-time-limit = 120s
debug-on-errors = true
sim-time-limit = 30 d
record-eventlog = true
print-undisposed = false
#simtime-format = "%H:%M:%S"

#record-eventlog = true
#output-scalar-file = results/scalars.csv
#output-vector-file = results/vectors.csv

#basic system parameters
**.numEndnodes = 50					# 20 typical
**.sensitivityAllRadios = -114.0	# default -122
**.enableKeeperDistortion = 0		# 0 - disable; 1 - enable
**.missedPacketsToSearchRelay = 2 	# after how many missed frames end node starts looking for a relay
**.retransmissionModel = 2			# 1 TS011 ; 2 - M&T
**.clockDriftMax = 40.0				# ppm
**.pathlosStd = 4.41				#4.42 normal


# TS011-1.0.1 parameters. These are intentionally static: this study does not
# model Relay MAC commands, but every protocol mechanism can be configured here.
**.ts011DefaultWorChannel = 1
**.ts011SecondWorChannel = 2
**.ts011SecondChannelEnabled = false
**.ts011UplinkChannel = 1
**.ts011RelayUplinkChannel = 3
**.ts011Rx2Channel = 1
**.ts011RxrChannel = 1
**.ts011CadPeriodicity = 1s       # TS011 values: 1s, 500ms, 250ms, 100ms, 50ms, 20ms
**.ts011ChannelScanSymbols = 8
**.ts011CadToRxSymbols = 8        # allowed encoding: 2, 4, 6, 8 symbols
**.ts011EndDeviceSpreadingFactor = 10
**.ts011RelaySpreadingFactor = 9
**.ts011RelayClockAccuracyPpm = 40
**.ts011EndDeviceClockAccuracyPpm = 40
**.ts011WorAckDelay = 1s
**.ts011WorDataDelay = 1s
**.ts011WorValidityProbability = 1.0
**.ts011WorAckWindow = 1s
**.ts011UplinkListenTimeout = 8s
**.ts011RelayForwardDelay = 1s
**.ts011RxrDelay = 7s          # aligned with RX1/RX2 durations and inter-window delays below
**.ts011WorAckProbability = 1.0
**.ts011MaximumForwardedPayload = 222
**.ts011ForwardingEnabled = true
**.ts011JoinReloadRate = 4
**.ts011JoinBucketSize = 8
**.ts011PerDeviceReloadRate = -1  # negative means no limit
**.ts011PerDeviceBucketSize = 0
**.ts011TrustedReloadRate = 8
**.ts011TrustedBucketSize = 16
**.ts011GlobalReloadRate = 8
**.ts011GlobalBucketSize = 16
**.applicationPayloadLength = 51

#EP431 parameters
**.EP431EndnodeRelaySF = 12			#spreading factor

#topology
#**.relay01.xpos = 326.0  
#**.relay01.ypos = 303.0       
#**.relay02.xpos = 460.0  
#**.relay02.ypos = 105.0    
#**.gateway.xpos = 110.0
#**.gateway.ypos = 84.0


#Radio activity paramters
**.listeningWindowStart1 = 0 #0:00  midnight
**.listeningWindowStart2 = 60 #1am
**.listeningWindowDuration1 = 0 #minutes of listening
**.listeningWindowDuration2 = 0 #minutes of listening 

**.transmittingWindowStart1 = 0 #
**.transmittingWindowStart2 = 12*60 # 
**.transmittingWindowDuration1 = 180 #minutes 		// to speed up simulation (this is 1 - 6 min)
**.transmittingWindowDuration2 = 180 #minutes


#LoRa Parameters:
**.listeningWindowRX1 = 1.0  #listening window 1 duration in seconds
**.listeningWindowRX2 = 1.0  #listening window 2 duration in seconds
**.listeningWindowRXR = 1.0  #listening relay window duration in seconds
**.listeningWindowRXC = 1.0  #time between transmission and RX1, and beetween RX1 and RX2, in seconds
**.listeningWindowRXCR = 3.0 #time beetween RX2 and RXR, in seconds

**.currentConsumptionRx = 9.0 #current consumption during reception in mA
**.currentConsumptionTx = 39.0 #current consumption during transmission in mA
**.currentConsumptionWOR = 0.070 #current consumption during reception in mA		FOR SF10!
**.currentConsumptionIdle = 0.004 #currnet consumption when radio off


**.sendInterval = exponential(20s)


# Comparative experiment family: the topology, traffic and propagation model
# are shared so TS011 and EP431 differ only in the relay access mechanism.
[Config RelayComparisonBase]
extends = General
network = Chapter7Network
**.numRelays = 1
**.numGateways = 1
**.numIpBridges = 0
**.numEndnodes = 50
warmup-period = 1d

[Config TS011_Default]
extends = RelayComparisonBase
**.retransmissionModel = 1
**.ts011CadPeriodicity = 1s
**.ts011SecondChannelEnabled = false

[Config TS011_DualChannel]
extends = TS011_Default
**.ts011CadPeriodicity = 500ms
**.ts011SecondChannelEnabled = true

[Config TS011_ParameterSweep]
extends = RelayComparisonBase
**.retransmissionModel = 1
**.ts011CadPeriodicity = ${cad=1s,500ms,250ms,100ms,50ms,20ms}
**.ts011SecondChannelEnabled = ${dual=false,true}
**.ts011RelayClockAccuracyPpm = ${relayPpm=10,20,30,40}

[Config TS011_EnvironmentSweep]
extends = TS011_Default
**.pathlosStd = ${sigma=2,4.41,8}
**.sensitivityAllRadios = ${rxThreshold=-120,-114,-108}

[Config EP431_Reference]
extends = RelayComparisonBase
**.retransmissionModel = 2


[Config Daily_1GW_500]
extends = General
network = DailyRead_1GW
sim-time-limit = 30 d

**.numEndnodes = 100
**.playgroundWidth = 1400
**.playgroundHeight = 900
**.endnodeIconSize = 10

**.endnode[*].logic.windowsPerDay = 2
**.endnode[*].logic.transmittingWindowStart1    = 0
**.endnode[*].logic.transmittingWindowDuration1 = 180
**.endnode[*].logic.transmittingWindowStart2    = 720
**.endnode[*].logic.transmittingWindowDuration2 = 180
**.endnode[*].logic.framesPerWindowMin = 1
**.endnode[*].logic.framesPerWindowMax = 2

[Config Daily_2GW_500]
extends = General
network = DailyRead_2GW
sim-time-limit = 30 d

**.numEndnodes = 100
**.playgroundWidth = 1400
**.playgroundHeight = 900
**.endnodeIconSize = 10

**.endnode[*].logic.windowsPerDay = 2
**.endnode[*].logic.transmittingWindowStart1    = 0
**.endnode[*].logic.transmittingWindowDuration1 = 180
**.endnode[*].logic.transmittingWindowStart2    = 720
**.endnode[*].logic.transmittingWindowDuration2 = 180
**.endnode[*].logic.framesPerWindowMin = 1
**.endnode[*].logic.framesPerWindowMax = 2
