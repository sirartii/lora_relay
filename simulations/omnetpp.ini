[General]
network = LoraRelay
simtime-resolution = ms
#cpu-time-limit = 120s
debug-on-errors = true
sim-time-limit = 20 d
record-eventlog = true

**.relay01.xpos = 326.0  
**.relay01.ypos = 303.0       
**.relay02.xpos = 460.0  
**.relay02.ypos = 105.0    
#**.endnode[0].xpos = 745.0
#**.endnode[0].ypos = 195.0
#**.endnode[1].xpos = 705.0
#**.endnode[1].ypos = 95.0
**.gateway.xpos = 110.0
**.gateway.ypos = 84.0

**.listeningWindowStart1 = 60 #1am - 60 minutes past midnight
**.listeningWindowStart2 = 360 #6am

**.listeningWindowDuration1 = 0 #minutes of listening
**.listeningWindowDuration2 = 0 #minutes of listening 

**.transmittingWindowStart1 = 60 #1am - 60 minutes past midnight
**.transmittingWindowStart2 = 360 #6am
**.transmittingWindowDuration1 = 120 #minutes 
**.transmittingWindowDuration2 = 120 #minutes 

**.listeningWindowRX1 = 1.0  #listening window 1 duration in seconds
**.listeningWindowRX2 = 1.0  #listening window 2 duration in seconds
**.listeningWindowRXR = 1.0  #listening relay window duration in seconds
**.listeningWindowRXC = 1.0  #time between transmission and RX1, and beetween RX1 and RX2, in seconds
**.listeningWindowRXCR = 2.0 #time beetween RX2 and RXR, in seconds
**.currentConsumptionRx = 9.0 #current consumption during reception in mA
**.currentConsumptionTx = 39.0 #current consumption during transmission in mA

#*.endnode[0].logic.sendInterval = 10 min
#**.sendInterval = 10 d
**.sendInterval = exponential(20s)

