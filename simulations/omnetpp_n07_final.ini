include omnetpp_review.ini

# Final section 1.3: five explicit scenarios. Daily read success is DATA-only.
# New scenarios do not change the default K=6 in the existing review baseline.
[Config N07_EP_All]
extends = Review_EP_Base
description = "N07 50 days, 385 ED, EP K=3, all devices eligible"
sim-time-limit = 50d
warmup-period = 0d
**.numEndnodes = 350
**.extranodex1 = 18
**.extranodex2 = 17
**.transmittingWindowDuration1 = 720
**.transmittingWindowDuration2 = 720
**.missedPacketsToSearchRelay = 3
**.exportFrameRecords = true

[Config N07_EP_I_II]
extends = N07_EP_All
description = "N07 EP designation restricted to groups I/II"
**.epDesignationRestricted = true

[Config N07_TS_All]
extends = Review_TS011_Base
description = "N07 TS011 with legacy forwarding limits"
sim-time-limit = 50d
warmup-period = 0d
**.numEndnodes = 350
**.extranodex1 = 18
**.extranodex2 = 17
**.transmittingWindowDuration1 = 720
**.transmittingWindowDuration2 = 720
**.exportFrameRecords = true

[Config N07_TS_I_II]
extends = N07_TS_All
description = "N07 TS011 legacy limits and static whitelist groups I/II"
**.ts011WhitelistRestricted = true

[Config N07_TS_NoBuckets]
extends = N07_TS_All
description = "N07 TS011 reference without Join/trusted/global bucket rates"
**.ts011JoinReloadRate = -1
**.ts011TrustedReloadRate = -1
**.ts011GlobalReloadRate = -1
