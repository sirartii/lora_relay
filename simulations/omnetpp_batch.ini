[Config SweepNumEndnodes]
description = "Symulacja z różnymi parametrami"
extends = General
repeat = 10
network = ${DailyRead_1GW, DailyRead_2GW}
**.numEndnodes = ${numEndnodes=50,100,150,200,250,300}

[Config RelaySingle]
description = "Symulacja z różnymi parametrami"
extends = General
repeat = 1
network = LoraRelay3
**.numEndnodes = 20

[Config RelayDualTS]
description = "Symulacja z różnymi parametrami"
extends = General
sim-time-limit = 365 d
repeat = 10
network = LoraRelay3
**.numEndnodes = 50
**.framesPerWindowMin = 4
**.missedPacketsToSearchRelay = 2
**.retransmissionModel = 1			# 1 TS011 ; 2 - M&T

[Config IslandsMultiple]
extends = Islands
**.framesPerWindowMin = ${1..8}
#**.framesPerWindowMin = 3
#${numEndnodes=50,100,150,200,250,300,350,400,450,500}
#sim-time-limit = 100 d

[Config Islands]
description = "50 urządzeń wokół GW + 2 wyspy"
extends = General
repeat = 30
network = LoraRelay
**.numEndnodes = 50
**.enableKeeperDistortion = 0
**.sensitivityAllRadios = -114.0
**.retransmissionModel = 1
**.framesPerWindowMin = 2
**.transmittingWindowDuration1 = 720 
**.transmittingWindowDuration2 = 720
**.forceSF = -1
**.ADRtarget = 9
**.ADRtolerance = 5

[Config IslandsDouble]
description = "Na potrzeby wygenerowanie 2 obrazkow"
extends = General
repeat = 2
network = LoraRelay


[General]
network = LoraRelay
simtime-resolution = 1ms
#cpu-time-limit = 120s
debug-on-errors = true
sim-time-limit = 30 d
record-eventlog = false
print-undisposed = false

#record-eventlog = true
#output-scalar-file = results/scalars.csv
#output-vector-file = results/vectors.csv

#basic system parameters
**.numEndnodes = 50					# 20 typical
**.sensitivityAllRadios = -114.0	# default -122 
**.enableKeeperDistortion = 0		# 0 - disable; 1 - enable
**.missedPacketsToSearchRelay = 3 	# after how many missed frames end node starts looking for a relay
**.retransmissionModel = 2			# 1 TS011 ; 2 - M&T
**.clockDriftMax = 40				# ppm
**.pathlosStd = 4.41				#4.42 normal
**.forceSF = -1


#TS011 parameters
**.ts011CadPeriodicity = 1s
**.ts011ChannelScanSymbols = 8
**.ts011SecondChannelEnabled = false
**.ts011EndDeviceSpreadingFactor = 9

#EP431 parameters
**.EP431EndnodeRelaySF = 9			#spreading factor

#Radio activity paramters
**.listeningWindowStart1 = 0 #0:00  midnight
**.listeningWindowStart2 = 720 #1am
**.listeningWindowDuration1 = 0 #minutes of listening
**.listeningWindowDuration2 = 0 #minutes of listening 

**.transmittingWindowStart1 = 0 #
**.transmittingWindowStart2 = 720 # 
**.transmittingWindowDuration1 = 720 #minutes 		// to speed up simulation (this is 1 - 6 min)
**.transmittingWindowDuration2 = 720 #minutes


#LoRa Parameters:
**.listeningWindowRX1 = 1.0  #listening window 1 duration in seconds
**.listeningWindowRX2 = 1.0  #listening window 2 duration in seconds
**.listeningWindowRXR = 1.0  #listening relay window duration in seconds
**.listeningWindowRXC = 1.0  #time between transmission and RX1, and beetween RX1 and RX2, in seconds
**.listeningWindowRXCR = 3.0 #time beetween RX2 and RXR, in seconds

**.currentConsumptionRx = 4.6 #current consumption during reception in mA
**.currentConsumptionTx = 25.5 #current consumption during transmission in mA
**.currentConsumptionWOR = 0.89 #current consumption during reception in mA		FOR SF10!
**.currentConsumptionIdle = 0.0253 #currnet consumption when radio off

**.sendInterval = exponential(20s)
